name: Ad-hoc Fork Release Build

# Why: this fork carries custom features and improvements on top of main.
# release-cut.yml is gated to `github.repository == 'stablyai/orca'` and no-ops on forks.
# This workflow packages the real AppImage / NSIS installer, publishes them directly
# to GitHub Releases (zero Actions storage quota used), and retains only the 3 most
# recent releases automatically.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build from
        required: false
        type: string
        default: justshinobi/main
      prerelease:
        description: Mark as pre-release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-builder-linux-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-linux-

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron

      - name: Build package inputs
        run: |
          status=0
          pnpm run build:cli || status=1

          scripts=(build:relay build:electron-vite:parallel)
          pids=()
          for script in "${scripts[@]}"; do
            pnpm run "$script" &
            pids+=("$!")
          done

          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"

      - name: Project web client from renderer build
        run: pnpm run build:web-from-renderer

      - name: Build native components
        run: pnpm run build:native

      - name: Package AppImage
        env:
          ORCA_REUSE_PREPARED_NATIVE_RUNTIME: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Why: config/electron-builder.config.cjs hardcodes publish.owner/repo to
        # stablyai/orca (the upstream project). Override both so this fork's
        # build publishes to JustShinobi/orca instead of the real upstream repo.
        run: |
          pnpm exec electron-builder --config config/electron-builder.config.cjs --linux AppImage \
            -c.publish.owner="${{ github.repository_owner }}" \
            -c.publish.repo="${{ github.event.repository.name }}"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: orca-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows installer
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-windows-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-windows-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package inputs
        run: pnpm run build:release

      - name: Prepare Electron native runtime
        run: node config/scripts/ensure-native-runtime.mjs --runtime=electron

      - name: Package NSIS installer (unsigned)
        env:
          ORCA_REUSE_PREPARED_NATIVE_RUNTIME: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Why: config/electron-builder.config.cjs hardcodes publish.owner/repo to
        # stablyai/orca (the upstream project). Override both so this fork's
        # build publishes to JustShinobi/orca instead of the real upstream repo.
        run: |
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win nsis `
            "-c.publish.owner=${{ github.repository_owner }}" `
            "-c.publish.repo=${{ github.event.repository.name }}"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: orca-windows-setup
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: orca-linux-appimage
          path: release-assets

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: orca-windows-setup
          path: release-assets

      - name: Create Release and Prune Old Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          DATE=$(date +'%Y%m%d-%H%M')
          TAG="v${VERSION}-fork-${DATE}"
          TITLE="Orca Fork v${VERSION} (${DATE})"

          echo "Publishing release: $TAG"
          ls -la release-assets/

          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" \
            release-assets/* \
            --title "$TITLE" \
            --notes "Automated release build for ref \`${{ inputs.ref }}\` (commit \`${{ github.sha }}\`)." \
            $PRERELEASE_FLAG

          echo "Release created successfully: https://github.com/${{ github.repository }}/releases/tag/$TAG"

          # Prune old releases to keep only the 3 most recent
          echo "Checking existing releases (retaining latest 3)..."
          OLD_TAGS=$(gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' || true)

          for old_tag in $OLD_TAGS; do
            if [ -n "$old_tag" ]; then
              echo "Pruning older release: $old_tag"
              gh release delete "$old_tag" --yes --cleanup-tag || true
            fi
          done

          echo "Retention check complete. Kept the latest 3 releases."
